apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: hcie-final-prom
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  # Compatibility aliases — many bundled dashboards hard-code these datasource UIDs.
  # Point them at the same Prometheus so their panels resolve instead of "No data".
  - name: Prometheus (compat-default)
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090/prometheus
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Prometheus (compat-grafana)
    type: prometheus
    access: proxy
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090/prometheus
    editable: false
    jsonData:
      timeInterval: 15s
